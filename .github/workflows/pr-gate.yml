name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Hermetic ──────────────────────────────────────────────────────
  # tsc + jest + ruff + bandit — no infrastructure required
  hermetic:
    name: "Hermetic (tsc · jest · ruff · bandit)"
    runs-on: [self-hosted, linux, controlroom]
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: app/controlroom_frontend
        run: npm ci
      - name: Run hermetic checks
        run: bazel test --config=ci //:unit

  # ── Job 2: Backend tests ──────────────────────────────────────────────────
  # pytest — requires live PostgreSQL (controlroomdb_test)
  backend-tests:
    name: "Backend tests (pytest)"
    runs-on: [self-hosted, linux, controlroom]
    needs: hermetic
    steps:
      - uses: actions/checkout@v4
      - name: Verify production stack is healthy
        run: |
          curl -sfk https://localhost:5150/health || \
            { echo "Production stack is not running. Run ./roadie.sh start from the workspace."; exit 1; }
      - name: Run pytest
        run: bazel test --config=ci-infra --test_output=streamed //app/controlroom_backend/tests:pytest

  # ── Job 3: Security scans ─────────────────────────────────────────────────
  # sonar-gate + trivy + secrets — runs in parallel with backend-tests
  security-scans:
    name: "Scans (sonar · trivy · secrets)"
    runs-on: [self-hosted, linux, controlroom]
    needs: hermetic
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: app/controlroom_frontend
        run: npm ci
      - name: Verify production + dev stack is healthy
        run: |
          curl -sfk https://localhost:5150/health || \
            { echo "Production stack is not running. Run ./roadie.sh start --dev from the workspace."; exit 1; }
          curl -sf http://localhost:1969 || \
            { echo "Dev stack is not running. Run ./roadie.sh start --dev from the workspace."; exit 1; }
      - name: SonarQube scan + quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bazel test --config=ci-infra --test_output=streamed //tests:scan_sonar
      - name: Trivy image scan
        run: bazel test --config=ci-infra --test_output=streamed //tests:scan_trivy
      - name: Secrets audit
        run: bazel test --config=ci-infra --test_output=streamed //tests:scan_secrets

  # ── Job 4: E2E ────────────────────────────────────────────────────────────
  # Playwright — requires full Docker stack
  e2e:
    name: "E2E (Playwright)"
    runs-on: [self-hosted, linux, controlroom]
    needs: [backend-tests, security-scans]
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: app/controlroom_frontend
        run: npm ci
      - name: Verify production stack is healthy
        run: |
          curl -sfk https://localhost:5150/health || \
            { echo "Production stack is not running. Run ./roadie.sh start from the workspace."; exit 1; }
      - name: Run Playwright
        run: bazel test --config=ci-infra --test_output=streamed //app/controlroom_frontend/e2e:playwright

  # ── Job 5: Performance ────────────────────────────────────────────────────
  # Benchmarks + k6 + Lighthouse — push to main only, non-blocking
  perf:
    name: "Performance (benchmarks · k6 · Lighthouse)"
    runs-on: [self-hosted, linux, controlroom]
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostics
        run: |
          echo "node: $(node --version 2>/dev/null || echo 'not found')"
          echo "npm:  $(npm --version 2>/dev/null || echo 'not found')"
          echo "NVM_DIR: ${NVM_DIR:-not set}"
          echo "PATH: $PATH"
          roadie version
      - name: Install frontend dependencies
        working-directory: app/controlroom_frontend
        run: npm ci
      - name: Verify production stack is healthy
        run: |
          curl -sfk https://localhost:5150/health || \
            { echo "Production stack is not running. Run roadie start from the workspace."; exit 1; }
      - name: Run performance suite
        run: bazel test --config=ci-infra --test_output=streamed //tests:perf
