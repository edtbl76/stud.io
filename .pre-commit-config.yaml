repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--quiet]
        files: ^app/controlroom_backend/

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests (tsc + jest + ruff + bandit + pytest)
        entry: bash -c 'source ~/.nvm/nvm.sh 2>/dev/null || true; export PATH="$HOME/go/bin:$PATH"; roadie test unit'
        language: system
        pass_filenames: false
        always_run: true

      - id: pip-audit
        name: pip-audit
        entry: bash -c 'source ~/.nvm/nvm.sh 2>/dev/null || true; roadie test unit pip-audit'
        language: system
        pass_filenames: false
        always_run: true

      - id: npm-audit
        name: npm-audit
        entry: bash -c 'source ~/.nvm/nvm.sh 2>/dev/null || true; roadie test unit npm-audit'
        language: system
        pass_filenames: false
        always_run: true

      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook
        language: system
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|\.secrets\.baseline|app/studio_frontend/e2e/\.auth/|app/studio_frontend/perf-reports/
