# Trivy vulnerability suppressions — controlroom_backend image ONLY.
#
# This file is applied only to the controlroom_backend scan (see roadie
# TrivyBackendStep), so a rule here can never suppress a finding in the
# studio_frontend image. Every rule is scoped to its package(s) via `purls`, with
# a `statement` justification and an `expired_at` review date (after which the
# suppression lapses and the CVE re-fails the gate). Review horizon: 2027-02-08.
#
# Consumed by `roadie test scan trivy` via
# `trivy image --ignorefile .trivyignore.backend.yaml`.
# Re-reviewed 2026-11-10 after every suppression lapsed on 2026-10-23 and CI's scan went red. The backend base was
# rebuilt on python:3.12.15-slim (pinned by digest); none of the remaining findings has a Debian fix. 19 entries
# the new base no longer needs were removed; 3 were renewed; 22 new ones were added, each with the check behind it.
vulnerabilities:
  - id: CVE-2025-69720
    purls:
      - "pkg:deb/debian/libncursesw6"
      - "pkg:deb/debian/libtinfo6"
      - "pkg:deb/debian/ncurses-base"
      - "pkg:deb/debian/ncurses-bin"
    statement: >-
      ncurses — buffer overflow. No fix available in debian trixie. ncurses is not used by the application; present only as an indirect OS dependency. Renewed 2026-11-10.
    expired_at: 2027-02-08

  - id: CVE-2026-107364
