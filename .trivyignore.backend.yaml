      - "pkg:deb/debian/libgssapi-krb5-2"
      - "pkg:deb/debian/libk5crypto3"
      - "pkg:deb/debian/libkrb5-3"
      - "pkg:deb/debian/libkrb5support0"
    statement: >-
      krb5 server-side (KDC ASN.1 decoder read overrun). The image carries only the client libraries; the KDC (krb5kdc) and kadmind are not installed (checked 2026-11-10), so nothing here runs the vulnerable code. No fix in trixie.
    expired_at: 2027-02-08

