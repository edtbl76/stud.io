# Trivy vulnerability suppressions — studio_frontend image ONLY.
#
# This file is applied only to the studio_frontend scan (see roadie
# TrivyFrontendStep), so a rule here can never suppress a finding in the
# controlroom_backend image. Every rule is scoped to its package(s) via `purls`,
# with a `statement` justification and an `expired_at` review date (after which the
# suppression lapses and the CVE re-fails the gate).
#
# Consumed by `roadie test scan trivy` via
# `trivy image --ignorefile .trivyignore.frontend.yaml`.
#
# Re-reviewed 2026-11-10 after every suppression lapsed on 2026-10-23 and CI's scan went red. The image was rebuilt
# on node:20.20.2-alpine (pinned by digest) with a refreshed apk layer, npm 11.21.1 installed over the bundled npm, and
# raised package.json overrides. That cleared 20 of the 22 old entries (the whole npm-CLI bundle set: tar, sigstore,
# ip-address, glob, minimatch, cross-spawn, brace-expansion; plus app-tree js-yaml and ws), so they were removed.
# What remains has no upstream fix. (The three undici entries for npm's bundle went 2026-11-11 with npm 11.21.2.)
vulnerabilities:
  # ── extract-zip — no upstream fix ───────────────────────────────────────────
  # extract-zip 2.0.1 is the latest published version; both CVEs are status `affected`.
  # package-lock.json marks it `dev: true`: it is pulled only by
  # lighthouse -> puppeteer-core -> @puppeteer/browsers (2.13.0), which extracts Chrome
  # builds fetched from Google's CDN at perf-test time. Never attacker-supplied archives,
  # never in the request path. Re-checked 2026-11-10.
  - id: CVE-2026-56876
    purls: &extract_zip_purls
      - "pkg:npm/extract-zip"
    statement: >-
      extract-zip — arbitrary file write / information disclosure via symlink validation bypass. No upstream fix
      (2.0.1 is latest). Dev-only (lockfile dev: true) via lighthouse -> puppeteer-core -> @puppeteer/browsers,
      which only unpacks Chrome builds from Google's CDN at perf-test time. Renewed 2026-11-10.
    expired_at: 2027-02-08

  - id: CVE-2026-19693
    purls: *extract_zip_purls
    statement: >-
      extract-zip — arbitrary file write via symlink in archive. No upstream fix (2.0.1 is latest). Same dev-only
      perf-test path as CVE-2026-56876; no untrusted archive ever reaches it. Added 2026-11-10.
    expired_at: 2027-02-08
