  - id: CVE-2026-29786
    purls: *node_tar_purls
    statement: "node-tar path-traversal / file-overwrite variant. npm-CLI bundle in node:20-alpine (node-tar 6.2.1), dev-only next-dev container, not an app dep. Fixed by node-tar 7.x (node:24-alpine = 7.5.15); base bump deferred to the node-base-upgrade chore. See section header."
    expired_at: 2026-10-23

  - id: CVE-2026-31802
    purls: *node_tar_purls
    statement: "node-tar path-traversal / file-overwrite variant. npm-CLI bundle in node:20-alpine (node-tar 6.2.1), dev-only next-dev container, not an app dep. Fixed by node-tar 7.x (node:24-alpine = 7.5.15); base bump deferred to the node-base-upgrade chore. See section header."
    expired_at: 2026-10-23

  - id: CVE-2026-59873
    purls: *node_tar_purls
    statement: >-
      node-tar 59873 (CRITICAL) — DoS via crafted gzip bomb. npm-CLI bundle in
      node:20-alpine (ships node-tar 6.2.1), dev-only next-dev container, not an app
      dep. Fixed in node-tar 7.5.19 but NO node base ships it yet (node:24 = 7.5.15),
      so no patched base is available. See section header.
    expired_at: 2026-10-23

  - id: CVE-2026-59874
    purls: *node_tar_purls
    statement: >-
      node-tar 59874 (HIGH) — DoS via malformed tar archive. npm-CLI bundle in
      node:20-alpine (ships node-tar 6.2.1), dev-only next-dev container, not an app
      dep. Fixed in node-tar 7.5.19 but NO node base ships it yet (node:24 = 7.5.15),
      so no patched base is available. See section header.
    expired_at: 2026-10-23

  - id: CVE-2026-69192
    purls:
      - "pkg:npm/ip-address"
    statement: >-
      ip-address — inconsistent IP parsing leading to SSRF. Residual only in the
      node:20-alpine npm-CLI bundle (ships ip-address 9.0.5 via
      make-fetch-happen→socks-proxy-agent→socks); not app-installable. The app tree
      is pinned to the fixed 10.3.1 via a package.json `overrides` entry, so this
      rule cannot mask an app dependency. Cleared by the node-base-upgrade chore.
      See section header.
    expired_at: 2026-10-23

  - id: CVE-2026-48815
    purls:
      - "pkg:npm/sigstore"
    statement: >-
      sigstore < 4.1.1 — certificateOIDs verification bypass. npm-CLI bundle in
      node:20-alpine (ships sigstore 2.3.1), dev-only next-dev container; runs only
      during npm publish/provenance, never at runtime. A patched base EXISTS
      (node:24-alpine ships sigstore 4.1.1); adopting it is deferred to the tracked
      frontend node-base-upgrade infra chore. See section header.
    expired_at: 2026-10-23

  # brace-expansion — the APP tree is pinned to the fixed 5.0.9 via a package.json
  # `overrides` entry (npm dedupes every nested copy to one 5.0.9), so these CVEs no
  # longer touch app dependencies. The only residual vulnerable copy is the one
  # bundled inside the npm CLI of node:20-alpine (brace-expansion 2.0.1), which is
  # not app-installable and is dev-only (next-dev). Fixed only once the base image
  # ships an npm whose bundle carries brace-expansion 5.0.9+ — tracked with the
  # node-base-upgrade chore. See section header.
  - id: CVE-2026-13149
    purls: &brace_expansion_purls
      - "pkg:npm/brace-expansion"
    statement: "brace-expansion ReDoS — residual only in the node:20-alpine npm-CLI bundle (2.0.1); app tree pinned to fixed 5.0.9 via package.json overrides. Dev-only, not the request path. See section header."
    expired_at: 2026-10-23

  - id: CVE-2026-14257
    purls: *brace_expansion_purls
    statement: "brace-expansion DoS (through 5.0.7, fixed 5.0.8) — residual only in the node:20-alpine npm-CLI bundle (2.0.1); app tree pinned to fixed 5.0.9 via package.json overrides. Dev-only, not the request path. See section header."
    expired_at: 2026-10-23

  - id: CVE-2026-69152
    purls: *brace_expansion_purls
    statement: "brace-expansion DoS via unbounded intermediate arrays, bypassing the CVE-2026-14257 mitigation (fixed 5.0.9) — residual only in the node:20-alpine npm-CLI bundle (2.0.1); app tree pinned to fixed 5.0.9 via package.json overrides. Dev-only, not the request path. See section header."
    expired_at: 2026-10-23
