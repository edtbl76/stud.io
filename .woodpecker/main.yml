when:
  - event: push
    branch: main
  - event: [pull_request, manual]

# Isolate CI test databases from local dev to prevent concurrent run collisions.
# e2e shards become masterdb_test_ci_0..3; perf backend uses masterdb_test_ci.
variables:
  - &ci_db_env
    ROADIE_TEST_DB_SOURCE: masterdb_test_ci
    ROADIE_BUILD_DATABASES: masterdb_test_ci

steps:
  # ── Step 1: Provision CI test database ──────────────────────────────────────
  # Creates masterdb_test_ci if absent, then applies the current schema
  # and seeds. All other steps depend on this.
  - name: build
    image: /bin/bash
    commands:
      - docker exec studio_db psql -U studio -lqt | cut -d'|' -f1 | grep -qw masterdb_test_ci || docker exec studio_db createdb -U studio masterdb_test_ci
      - roadie build --schema-only
    environment:
      <<: *ci_db_env

  # ── Step 2: Install frontend dependencies ───────────────────────────────────
  # Runs once so unit-pbt, scan, and e2e share a single node_modules install.
  - name: npm-install
    image: /bin/bash
    depends_on: [build]
    commands:
      - cd app/studio_frontend && npm install --include=dev

  # ── Step 3: Unit + PBT ──────────────────────────────────────────────────────
  # tsc · jest · ruff · bandit · pytest · fast-check · hypothesis
  - name: unit-pbt
    image: /bin/bash
    depends_on: [npm-install]
    commands:
      - roadie test unit
      - roadie test pbt

  # ── Step 4: Security scans ──────────────────────────────────────────────────
  # sonar · trivy · secrets · headers — no DB contact
  - name: scan
    image: /bin/bash
    depends_on: [npm-install]
    commands:
      - '[ -n "$SONAR_TOKEN" ] || { echo "SONAR_TOKEN is empty — secret may be blocked (forked PR?) or not configured in Woodpecker."; exit 1; }'
      - curl -sf http://localhost:1969 || { echo "SonarQube is not running. Run 'roadie start --dev'."; exit 1; }
      - roadie test scan --gate
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token  # pragma: allowlist secret
    when:
      - event: push
        branch: main
      - event: pull_request
      - event: manual

  # ── Step 5: E2E ─────────────────────────────────────────────────────────────
  # Playwright shards — clones masterdb_test_ci → masterdb_test_ci_0..3
  # PLAYWRIGHT_BROWSERS_PATH must be set in each agent's .env (not here) because
  # the local backend overrides HOME to a temp dir, breaking Playwright discovery.
  - name: e2e
    image: /bin/bash
    depends_on: [npm-install]
    commands:
      - '[ -n "$PLAYWRIGHT_BROWSERS_PATH" ] || { echo "PLAYWRIGHT_BROWSERS_PATH is not set — add it to the agent .env (e.g. PLAYWRIGHT_BROWSERS_PATH=/home/<user>/.cache/ms-playwright)."; exit 1; }'
      - roadie test e2e
    environment:
      <<: *ci_db_env

  # ── Step 6: Performance ─────────────────────────────────────────────────────
  # benchmarks · k6 · Lighthouse — push to main and manual trigger only
  - name: perf
    image: /bin/bash
    depends_on: [unit-pbt, scan, e2e]
    commands:
      - roadie test perf
    environment:
      <<: *ci_db_env
    when:
      - event: push
        branch: main
      - event: manual

  # ── Step 7: plugin-scanner release ──────────────────────────────────────────
  # Cross-compile macOS Apple Silicon binary, zip with install.sh, upload to MinIO.
  # Runs on push to main and manual trigger only; depends on unit-pbt and scan.
  - name: plugin-scanner-release
    image: /bin/bash
    depends_on: [unit-pbt, scan]
    commands:
      - cd app/plugin_scanner && bash release.sh
    environment:
      MINIO_ACCESS_KEY:
        from_secret: minio_svc_access_key
      MINIO_SECRET_KEY:
        from_secret: minio_svc_secret_key
    when:
      - event: push
        branch: main
      - event: manual
