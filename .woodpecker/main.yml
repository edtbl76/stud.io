# B57 — pin STUD.io CI to the LOCAL backend (host shell + the real Go/Node/pyenv/Playwright toolchain),
# NOT the weyland kubernetes agents on the shared Woodpecker server. Every workflow must carry this label
# or it can schedule onto the wrong backend and fail.
labels:
  backend: local

when:
  - event: pull_request
    evaluate: 'not (CI_COMMIT_AUTHOR contains "[bot]")'
  - event: push
    branch: main
    evaluate: 'not (CI_COMMIT_AUTHOR contains "[bot]")'
  - event: manual

# Isolate CI test databases from local dev to prevent concurrent run collisions.
# e2e shards become masterdb_test_ci_0..3; perf backend uses masterdb_test_ci.
variables:
  - &ci_db_env
    ROADIE_TEST_DB_SOURCE: masterdb_test_ci
    ROADIE_BUILD_DATABASES: masterdb_test_ci
    # roadie applies schema via `docker compose exec studio_db`, which resolves the target by compose
    # PROJECT name. On a local Woodpecker agent the workflow runs from a clone dir whose name doesn't
    # match, so the project defaults wrong and studio_db isn't found. Pin it to studio_db's real project.
    COMPOSE_PROJECT_NAME: studio

steps:
  # ── Step 1: Provision CI test database ──────────────────────────────────────
  # Creates masterdb_test_ci if absent, then applies the current schema
  # and seeds. All other steps depend on this.
  - name: build
    image: /bin/bash
    commands:
      - rm -rf app/studio_frontend/.next-e2e-*
      - docker exec studio_db psql -U studio -lqt | cut -d'|' -f1 | grep -qw masterdb_test_ci || docker exec studio_db createdb -U studio masterdb_test_ci
      - roadie build --schema-only   # schema + seeds only; no stack rebuild (needs no .env), no tests. Populates reference tables so E2E dropdowns/dialogs aren't empty.
    environment:
      <<: *ci_db_env

  # ── Step 2: Install frontend dependencies ───────────────────────────────────
  # Runs once so unit-pbt, scan, and e2e share a single node_modules install.
  - name: npm-install
    image: /bin/bash
    depends_on: [build]
    commands:
      - cd app/studio_frontend && npm install --include=dev

  # ── Step 3: Unit + PBT ──────────────────────────────────────────────────────
  # tsc · jest · ruff · bandit · pytest · fast-check · hypothesis
  - name: unit-pbt
    image: /bin/bash
    depends_on: [npm-install]
    commands:
      - roadie test unit
      - roadie test pbt

  # ── Step 4: Security scans ──────────────────────────────────────────────────
  # sonar · trivy · secrets · headers — no DB contact
  - name: scan
    image: /bin/bash
    depends_on: [npm-install, unit-pbt]
    commands:
      - '[ -n "$SONAR_TOKEN" ] || { echo "SONAR_TOKEN is empty — secret may be blocked (forked PR?) or not configured in Woodpecker."; exit 1; }'
      - curl -sf http://192.168.1.243:30969/api/system/status || { echo "weyland SonarQube unreachable at 192.168.1.243:30969 (B127)."; exit 1; }
      - roadie test scan --gate
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token  # pragma: allowlist secret skipcq: SCT-A000
    when:
      - event: push
        branch: main
      - event: pull_request
      - event: manual

  # ── Step 5: E2E ─────────────────────────────────────────────────────────────
  # Playwright shards — clones masterdb_test_ci → masterdb_test_ci_0..3
  # PLAYWRIGHT_BROWSERS_PATH must be set in each agent's .env (not here) because
  # the local backend overrides HOME to a temp dir, breaking Playwright discovery.
  - name: e2e
    image: /bin/bash
    depends_on: [npm-install]
    commands:
      - '[ -n "$PLAYWRIGHT_BROWSERS_PATH" ] || { echo "PLAYWRIGHT_BROWSERS_PATH is not set — add it to the agent .env (e.g. PLAYWRIGHT_BROWSERS_PATH=/home/<user>/.cache/ms-playwright)."; exit 1; }'
      - roadie test e2e
    environment:
      <<: *ci_db_env

  # ── Step 6: Performance ─────────────────────────────────────────────────────
  # benchmarks · k6 · Lighthouse — push to main and manual trigger only
  - name: perf
    image: /bin/bash
    depends_on: [unit-pbt, scan, e2e]
    commands:
      - roadie test perf
    environment:
      <<: *ci_db_env
    when:
      - event: push
        branch: main
      - event: manual

  # ── Step 7: build status → Port ci_pipeline (B63 — CI reliability signal) ────
  # Reports the `main` workflow outcome to the weyland Port catalog. Two status-gated steps HARDCODE the status
  # instead of reading $CI_PIPELINE_STATUS — on this multi-workflow pipeline (main/plugin-scanner/roadie run in
  # parallel) that env var is EMPTY at main's notify time (pipeline not final), and Port silently drops an
  # empty-enum status (ingest returns ok:true, but no entity). Only `main` reports (plugin-scanner/roadie share the
  # pipeline number → would collide on the `repo-number` entity id; per-workflow ids are a later refinement).
  # Local backend → host curl; `|` block REQUIRED (inline `Content-Type:` colon makes the parser read a map).
  - name: notify-port-pass
    image: /bin/bash
    # MUST depend on every prior step. Without depends_on a step's only dep is the implicit clone, so
    # `when: status:` evaluates while the workflow is still mid-run (status still success) and fires a FALSE
    # green before scan/e2e/perf finish. Chaining behind all steps makes this the terminal stage, so the
    # status gate reflects main's real outcome.
    depends_on: [build, npm-install, unit-pbt, scan, e2e, perf]
    when:
      - status: success
    environment:
      PORT_INGEST_URL:
        from_secret: port_ingest_url
    commands:
      - |
        printf '{"number":%s,"status":"success","repo":"%s","branch":"%s","commit":"%s","event":"%s","url":"%s"}' "$CI_PIPELINE_NUMBER" "$CI_REPO" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_EVENT" "$CI_PIPELINE_URL" | curl -sf -X POST "$PORT_INGEST_URL" -H "Content-Type: application/json" -d @-
  - name: notify-port-fail
    image: /bin/bash
    depends_on: [build, npm-install, unit-pbt, scan, e2e, perf]
    when:
      - status: failure
    environment:
      PORT_INGEST_URL:
        from_secret: port_ingest_url
    commands:
      - |
        printf '{"number":%s,"status":"failure","repo":"%s","branch":"%s","commit":"%s","event":"%s","url":"%s"}' "$CI_PIPELINE_NUMBER" "$CI_REPO" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_EVENT" "$CI_PIPELINE_URL" | curl -sf -X POST "$PORT_INGEST_URL" -H "Content-Type: application/json" -d @-

