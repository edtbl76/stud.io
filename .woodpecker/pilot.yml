# B57 PILOT — minimal smoke test proving the weyland Woodpecker farm executes STUD.io's local-backend
# pipelines end-to-end: server (woodpecker.weyland.lab) -> :30900 gRPC -> a local agent on rogueone ->
# host shell -> native docker. Manual-trigger ONLY, touches nothing, safe to delete once execution is proven.
labels:
  backend: local

when:
  - event: manual

steps:
  - name: pilot-smoke
    image: /bin/bash
    commands:
      - 'echo "== B57 pilot running on $(hostname) as $(whoami) =="'
      - 'echo "-- toolchain on PATH --"; for t in bash go node npm python3 roadie docker; do printf "  %-8s %s\n" "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"; done'
      - 'echo "-- native docker reachable? --"; if docker exec studio_db true 2>/dev/null; then echo "  studio_db OK (docker exec works)"; else echo "  studio_db NOT reachable (check DOCKER_HOST/native engine)"; fi'
      - 'echo "== pilot-smoke complete =="'
