# B57 — pin to the LOCAL backend (host shell), not the weyland kubernetes agents on the shared server.
labels:
  backend: local

when:
  - event: pull_request
    path:
      - app/plugin_scanner/**
      - .woodpecker/plugin-scanner.yml
    evaluate: 'not (CI_COMMIT_AUTHOR contains "[bot]")'
  - event: push
    branch: main
    path:
      - app/plugin_scanner/**
      - .woodpecker/plugin-scanner.yml
    evaluate: 'not (CI_COMMIT_AUTHOR contains "[bot]")'
  - event: manual

steps:
  # ── Step 1: Build + release ──────────────────────────────────────────────────
  # Cross-compiles macOS Apple Silicon binary, zips with install.sh, uploads to
  # MinIO studio-downloads bucket. Runs on push to main and manual trigger only;
  # PR builds clone the repo but skip the release step.
  - name: plugin-scanner-release
    image: /bin/bash
    commands:
      - cd app/plugin_scanner && bash release.sh
    environment:
      MINIO_ACCESS_KEY:
        from_secret: minio_svc_access_key  # pragma: allowlist secret skipcq: SCT-A000
      MINIO_SECRET_KEY:
        from_secret: minio_svc_secret_key  # pragma: allowlist secret skipcq: SCT-A000
      BUILD_INCLUDE_MKCERT_CA: "1"
      MKCERT_CAROOT: /home/edwardmangini/.local/share/mkcert
      # B127: STUD.io's local MinIO (localhost:1983) is retired — upload to weyland's MinIO S3 (LAN NodePort 30990).
      MINIO_ENDPOINT: "http://192.168.1.243:30990"
    when:
      - event: push
        branch: main
      - event: manual
