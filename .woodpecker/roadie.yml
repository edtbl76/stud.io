# B57 — pin to the LOCAL backend (host shell), not the weyland kubernetes agents on the shared server.
labels:
  backend: local

when:
  - event: pull_request
    path:
      - roadie/**
      - .woodpecker/roadie.yml
    evaluate: 'not (CI_COMMIT_AUTHOR contains "[bot]")'
  - event: manual

steps:
  # ── Step 1: Vet + unit tests ─────────────────────────────────────────────────
  - name: unit
    image: /bin/bash
    commands:
      - cd roadie && go vet ./... && go test ./...

  # ── Step 2: Security scans ──────────────────────────────────────────────────
  - name: scan
    image: /bin/bash
    depends_on: [unit]
    commands:
      - roadie test scan secrets headers
    when:
      - event: pull_request
        path: roadie/**
      - event: manual
