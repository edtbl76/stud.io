services:
  controlroom_backend_test:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend_test
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb_test
      DB_USER: studio
      DB_PASSWORD: studio
    ports:
      - "5151:5150"
    networks:
      - studio_default
    restart: unless-stopped

  gearlist_backend_test:
    build:
      context: ./app/gearlist_backend
    container_name: gearlist_backend_test
    environment:
      APP_PORT: 4001
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_USER: studio
      DB_PASSWORD: studio  # pragma: allowlist secret
      DB_NAME: masterdb_test
    networks:
      - studio_default
    restart: unless-stopped

  sonarqube_db:
    image: postgres:17
    container_name: sonarqube_db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Agents run externally as systemd services (woodpecker-agent-1..4) using
  # WOODPECKER_BACKEND=local. They connect to this server on port 9000.
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker_server
    ports:
      - "1984:8000"
      - "9000:9000"
    environment:
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: Iv23liaJPsjezjNBlmtf
      WOODPECKER_GITHUB_APP_ID: "3427818"
      WOODPECKER_GITHUB_APP_PRIVATE_KEY_FILE: /etc/woodpecker/private-key.pem
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-edtbl76}
      WOODPECKER_OPEN: "false"
      WOODPECKER_DATABASE_DRIVER: sqlite3
      WOODPECKER_DATABASE_DATASOURCE: /var/lib/woodpecker/woodpecker.db
      WOODPECKER_GITHUB_SECRET_FILE: /run/secrets/woodpecker_client_secret
      WOODPECKER_AGENT_SECRET_FILE: /run/secrets/woodpecker_agent_secret
      WOODPECKER_FORGE_WEBHOOK_SECRET_FILE: /run/secrets/woodpecker_webhook_secret
    secrets:
      - woodpecker_client_secret
      - woodpecker_agent_secret
      - woodpecker_webhook_secret
    volumes:
      - woodpecker_data:/var/lib/woodpecker
      # Stable symlink: ln -sf stud-io-woodpecker.<date>.private-key.pem woodpecker-private-key.pem
      - ./woodpecker-private-key.pem:/etc/woodpecker/private-key.pem:ro
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonarqube_db
    ports:
      - "1969:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      SONAR_CE_JAVAOPTS: "-Xmx8g -Xms2g"
      SONAR_WEB_JAVAOPTS: "-Xmx2g -Xms512m"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  woodpecker_data:

secrets:
  woodpecker_client_secret:
    file: ./woodpecker_client_secret
  woodpecker_agent_secret:
    file: ./woodpecker_agent_secret
  woodpecker_webhook_secret:
    file: ./woodpecker_webhook_secret

networks:
  studio_default:
    external: true
