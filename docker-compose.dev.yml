services:
  controlroom_backend_test:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend_test
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb_test
      DB_USER: studio
      DB_PASSWORD: studio
    ports:
      - "5151:5150"
    networks:
      - studio_default
    restart: unless-stopped

  gearlist_backend_test:
    build:
      context: ./app/gearlist_backend
    container_name: gearlist_backend_test
    environment:
      APP_PORT: 4001
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_USER: studio
      DB_PASSWORD: studio  # pragma: allowlist secret
      DB_NAME: masterdb_test
    networks:
      - studio_default
    restart: unless-stopped

  # Shared Go toolchain image for the containerized roadie Go unit lane (gearlist_backend +
  # plugin_scanner). Build-only — roadie invokes it via `docker run`, it is never `up`'d.
  # Explicit image name so the tag is stable regardless of compose project name.
  go_test:
    build:
      context: ./docker
      dockerfile: go-test.Dockerfile
    image: dev-go_test:latest

  # Node toolchain image for the containerized roadie JS/TS unit lane (studio_frontend).
  # Build-only — roadie invokes it via `docker run`, it is never `up`'d.
  frontend_test:
    build:
      context: ./docker
      dockerfile: frontend-test.Dockerfile
    image: dev-studio_frontend_test:latest

  # sonarqube + sonarqube_db removed (B127) — STUD.io scans against the central weyland Sonar at
  # 192.168.1.243:30969 (project `controlroom`, token in ~/.config/studio/sonar-token). See roadie sonar.go + .woodpecker.

  # woodpecker-server REMOVED (B57/B127) — STUD.io CI runs on WEYLAND's Woodpecker (woodpecker.weyland.lab; agent
  # gRPC NodePort 192.168.1.243:30900), NOT a local server. The rogueone woodpecker-agent-1..4 systemd units connect
  # to weyland's server. No local CI server, no woodpecker_data/secrets here.

networks:
  studio_default:
    external: true
