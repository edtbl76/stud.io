services:
  controlroom_backend_test:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend_test
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: controlroomdb_test
      DB_USER: studio
      DB_PASSWORD: studio
    ports:
      - "5151:5150"
    networks:
      - studio_default
    restart: unless-stopped

  sonarqube_db:
    image: postgres:17
    container_name: sonarqube_db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  structurizr:
    image: structurizr/structurizr
    container_name: structurizr
    command: local
    ports:
      - "1967:8080"
    volumes:
      - ./structurizr:/usr/local/structurizr
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      - sonarqube_db
    ports:
      - "1969:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      SONAR_CE_JAVAOPTS: "-Xmx2g -Xms512m"
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  studio_default:
    external: true
