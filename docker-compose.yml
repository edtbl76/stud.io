services:
  db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  studio_db_data:
