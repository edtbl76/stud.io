name: studio

services:
  studio_db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  controlroom_backend:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb
      DB_USER: studio
      DB_PASSWORD: studio
      GOOGLE_CLIENT_ID: "684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com"
      GEARLIST_URL: http://gearlist_backend:4001
    depends_on:
      studio_db:
        condition: service_healthy
      gearlist_backend:
        condition: service_healthy
    restart: unless-stopped

  gearlist_backend:
    build:
      context: ./app/gearlist_backend
    container_name: gearlist_backend
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb
      DB_USER: studio
      DB_PASSWORD: studio
      APP_PORT: 4001
      MINIO_ENDPOINT: http://192.168.1.243:30990   # B127: central weyland MinIO (local studio_minio retired)
      MINIO_ACCESS_KEY: studio-svc
      MINIO_SECRET_KEY: ${STUDIO_MINIO_SECRET_KEY:?set STUDIO_MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: studio-photos
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      - studio_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # studio_minio + studio_minio_init removed (B127) — STUD.io uses the central weyland MinIO at
  # 192.168.1.243:30990 (scoped studio-svc user, buckets provisioned once on weyland). See docker-compose MINIO_* above.

  frontend:
    build:
      context: ./app/studio_frontend
    container_name: studio_frontend
    # B127: native bind-mounts enforce real UIDs (Docker Desktop's VM file-share was permissive). The image runs
    # as `appuser`, but the bind-mounted ./app is owned by host uid 1000 — run as 1000:1000 so Turbopack can
    # write its lockfile / .next cache into the mount.
    user: "1000:1000"
    environment:
      - BACKEND_URL=http://controlroom_backend:5150
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com
      - MINIO_ENDPOINT=http://192.168.1.243:30990   # B127: central weyland MinIO
      - MINIO_ACCESS_KEY=studio-svc
      - MINIO_SECRET_KEY=${STUDIO_MINIO_SECRET_KEY:?set STUDIO_MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET=studio-photos
    volumes:
      - ./app/studio_frontend:/app
      - /app/node_modules
    depends_on:
      - controlroom_backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: controlroom_nginx
    ports:
      - "2112:2112"
      - "5150:5150"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - controlroom_backend
      - frontend
    restart: unless-stopped

volumes:
  studio_db_data:
