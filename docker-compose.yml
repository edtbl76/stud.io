services:
  db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  controlroom_backend:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: controlroomdb
      DB_USER: studio
      DB_PASSWORD: studio
      GOOGLE_CLIENT_ID: "624395577295-k06o9nsf4agqkg0scn8tbavuhfmgba9r.apps.googleusercontent.com"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./app/controlroom_frontend
    container_name: controlroom_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost:5150
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=624395577295-k06o9nsf4agqkg0scn8tbavuhfmgba9r.apps.googleusercontent.com
    volumes:
      - ./app/controlroom_frontend:/app
      - /app/node_modules
    depends_on:
      - controlroom_backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: controlroom_nginx
    ports:
      - "2112:2112"
      - "5150:5150"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - controlroom_backend
      - frontend
    restart: unless-stopped

volumes:
  studio_db_data:
