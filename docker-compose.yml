services:
  db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  controlroom_backend:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend
    ports:
      - "5150:5150"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: controlroomdb
      DB_USER: studio
      DB_PASSWORD: studio
      GOOGLE_CLIENT_ID: ""
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./app/controlroom_frontend
    container_name: controlroom_frontend
    ports:
      - "2112:2112"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5150
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=
    volumes:
      - ./app/controlroom_frontend:/app
      - /app/node_modules
    depends_on:
      - controlroom_backend
    restart: unless-stopped

volumes:
  studio_db_data:
