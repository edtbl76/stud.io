name: studio

services:
  studio_db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  controlroom_backend:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb
      DB_USER: studio
      DB_PASSWORD: studio
      GOOGLE_CLIENT_ID: "684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com"
    depends_on:
      - studio_db
    restart: unless-stopped

  studio_minio:
    image: minio/minio:latest
    container_name: studio_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studiominio
    ports:
      - "1983:9000"
      - "1982:9001"
    volumes:
      - studio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  studio_minio_init:
    image: minio/mc:latest
    container_name: studio_minio_init
    depends_on:
      studio_minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://studio_minio:9000 studio studiominio &&
        mc mb --ignore-existing local/studio-photos &&
        echo 'Bucket studio-photos ready.'
      "
    restart: on-failure

  frontend:
    build:
      context: ./app/studio_frontend
    container_name: studio_frontend
    environment:
      - BACKEND_URL=http://controlroom_backend:5150
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com
      - MINIO_ENDPOINT=http://studio_minio:9000
      - MINIO_ACCESS_KEY=studio
      - MINIO_SECRET_KEY=studiominio
      - MINIO_BUCKET=studio-photos
    volumes:
      - ./app/studio_frontend:/app
      - /app/node_modules
    depends_on:
      - controlroom_backend
      - studio_minio
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: controlroom_nginx
    ports:
      - "2112:2112"
      - "5150:5150"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - controlroom_backend
      - frontend
    restart: unless-stopped

volumes:
  studio_db_data:
  studio_minio_data:
