services:
  db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backstage:
    build:
      context: ./app/controlroom_backend
    container_name: backstage
    ports:
      - "5150:5150"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: controlroomdb
      DB_USER: studio
      DB_PASSWORD: studio
    depends_on:
      - db
    restart: unless-stopped

volumes:
  studio_db_data:
