name: studio

services:
  studio_db:
    image: pgvector/pgvector:pg17
    container_name: studio_db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  controlroom_backend:
    build:
      context: ./app/controlroom_backend
    container_name: controlroom_backend
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb
      DB_USER: studio
      DB_PASSWORD: studio
      GOOGLE_CLIENT_ID: "684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com"
      GEARLIST_URL: http://gearlist_backend:4001
    depends_on:
      studio_db:
        condition: service_healthy
      gearlist_backend:
        condition: service_healthy
    restart: unless-stopped

  gearlist_backend:
    build:
      context: ./app/gearlist_backend
    container_name: gearlist_backend
    environment:
      DB_HOST: studio_db
      DB_PORT: 5432
      DB_NAME: masterdb
      DB_USER: studio
      DB_PASSWORD: studio
      APP_PORT: 4001
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      - studio_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  studio_minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: studio_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studiominio
    ports:
      - "1983:9000"
      - "1982:9001"
    volumes:
      - studio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - studiominio
    restart: unless-stopped

  studio_minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: studio_minio_init
    depends_on:
      studio_minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studiominio
      MINIO_SVC_ACCESS_KEY: studio-svc
      MINIO_SVC_SECRET_KEY: studiosvckey1
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://studiominio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/studio-photos &&
        mc mb --ignore-existing local/studio-downloads &&
        mc anonymous set download local/studio-downloads &&
        mc admin user add local $$MINIO_SVC_ACCESS_KEY $$MINIO_SVC_SECRET_KEY &&
        mc admin policy attach local readwrite --user $$MINIO_SVC_ACCESS_KEY &&
        echo 'MinIO: buckets and service account ready.'
      "
    restart: on-failure

  frontend:
    build:
      context: ./app/studio_frontend
    container_name: studio_frontend
    environment:
      - BACKEND_URL=http://controlroom_backend:5150
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=684766376270-3ovib79ic0m2upj7b5jp2ueh4ofunm0v.apps.googleusercontent.com
      - MINIO_ENDPOINT=http://studiominio:9000
      - MINIO_ACCESS_KEY=studio-svc
      - MINIO_SECRET_KEY=studiosvckey1
      - MINIO_BUCKET=studio-photos
    volumes:
      - ./app/studio_frontend:/app
      - /app/node_modules
    depends_on:
      - controlroom_backend
      - studio_minio
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: controlroom_nginx
    ports:
      - "2112:2112"
      - "5150:5150"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - controlroom_backend
      - frontend
    restart: unless-stopped

volumes:
  studio_db_data:
  studio_minio_data:
