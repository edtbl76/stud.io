providers:
  container:
    type: docker
    compose_file: docker-compose.yml
    dev_compose_file: docker-compose.dev.yml
  database:
    type: postgres
    service: studio_db
    user: studio
    db_name: masterdb

stack:
  health_checks:
    - name: PostgreSQL
      type: database
      user: studio
    - name: API
      type: http
      url: https://localhost:5150/health
    - name: Frontend
      type: http
      url: https://localhost:2112
    - name: GearList
      type: http
      url: http://localhost:4001/health
    - name: MinIO
      type: http
      url: http://192.168.1.243:30990/minio/health/live   # B127: central weyland MinIO (local studio_minio retired)
  dev_health_checks:
    - name: SonarQube
      type: http
      url: http://192.168.1.243:30969/api/system/status   # B127: central weyland Sonar (local sonarqube retired)
    # Woodpecker health-check removed (B57) — STUD.io CI runs on WEYLAND's Woodpecker, not a local dev-stack container.
  urls:
    app: https://localhost:2112
    api: https://localhost:5150
    docs: https://localhost:5150/docs
    gearlist: http://localhost:4001
    minio: https://minio.weyland.lab  # B127: weyland MinIO console (Keycloak forward-auth)
    sonarqube: https://sonarqube.weyland.lab  # B127: weyland Sonar (Keycloak forward-auth)
    woodpecker: https://woodpecker.weyland.lab  # B57: STUD.io CI runs on weyland's Woodpecker

build:
  schema_files:
    - sql/schema.sql
    - sql/gearlist_schema.sql
    - sql/scanner_schema.sql
    - sql/migrations/add_metadata_source.sql
    - sql/migrations/add_scanner_dismiss_keep.sql
    - sql/migrations/add_disk_paths.sql
    - sql/migrations/scanner_rewrite_u01.sql
    - sql/migrations/scanner_rewrite_u02_schema.sql
    - sql/migrations/scanner_rewrite_u05b_exclusions.sql
    - sql/migrations/scanner_rewrite_u08_vocab_snapshot.sql
    - sql/views.sql
  seed_files:
    - sql/seeds/01_entity_types.sql
    - sql/seeds/02_tag_types.sql
    - sql/seeds/03_plugin_formats.sql
    - sql/seeds/04_effect_types.sql
    - sql/seeds/05_instrument_types.sql
    - sql/seeds/06_model_types.sql
    - sql/seeds/07_tool_types.sql
    - sql/seeds/08_brands.sql
    - sql/seeds/09_models.sql
    - sql/seeds/10_workstations.sql
    - sql/seeds/11_workflow_tools.sql
    - sql/seeds/12_measurement_tools.sql
    - sql/seeds/13_reference_tools.sql
    - sql/seeds/14_composition_tools.sql
    - sql/seeds/15_admin_tools.sql
    - sql/seeds/16_effects.sql
    - sql/seeds/17_instruments.sql
    - sql/seeds/18_libraries.sql
    - sql/seeds/19_gear_types.sql
    - sql/seeds/20_gear.sql
  databases:
    - masterdb_test
  rebuild_on:
    - docker-compose.yml
    - app/controlroom_backend/Dockerfile
    - app/controlroom_backend/requirements.txt
    - app/studio_frontend/Dockerfile
    - app/studio_frontend/package.json
    - app/gearlist_backend/Dockerfile
    - app/gearlist_backend/go.sum
    - app/plugin_scanner/go.sum

test:
  e2e:
    shards: 4
    backend_compose_project: dev
    backend_service: controlroom_backend_test
    backend_internal_port: 5150
    backend_base_port: 5161
    frontend_base_port: 3001
    gearlist_service: gearlist_backend_test
    gearlist_port: 4012
    gearlist_internal_port: 4001
  perf:
    backend_port: 5160
    frontend_port: 3010
    carbon_base_url: ""
    gearlist_service: gearlist_backend_test
    gearlist_port: 4011
    gearlist_internal_port: 4001
  pbt:
    # examples controls how many generated test cases fast-check and hypothesis
    # each produce per property. Increase for more thorough pre-release runs.
    # Default: 100
    examples: 100
  db:
    container: studio_db
    user: studio
    password: studio  # pragma: allowlist secret
    source: masterdb_test
