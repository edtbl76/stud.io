providers:
  container:
    type: docker
    compose_file: docker-compose.yml
    dev_compose_file: docker-compose.dev.yml
  database:
    type: postgres
    service: studio_db
    user: studio
    db_name: masterdb

stack:
  health_checks:
    - name: PostgreSQL
      type: database
      user: studio
    - name: API
      type: http
      url: https://localhost:5150/health
  dev_health_checks:
    - name: SonarQube
      type: http
      url: http://localhost:1969
  urls:
    app: https://localhost:2112
    api: https://localhost:5150
    docs: https://localhost:5150/docs
    sonarqube: http://localhost:1969

build:
  schema_files:
    - sql/schema.sql
    - sql/views.sql
  seed_files:
    - sql/seeds/01_entity_types.sql
  databases:
    - masterdb_test
  rebuild_on:
    - docker-compose.yml
    - app/controlroom_backend/Dockerfile

test:
  e2e:
    shards: 4
    backend_compose_project: dev
    backend_service: controlroom_backend_test
    backend_internal_port: 5150
    backend_base_port: 5151
    frontend_base_port: 3001
  perf:
    backend_port: 5160
    frontend_port: 3010
    carbon_base_url: ""
  pbt:
    examples: 50
  db:
    container: studio_db
    user: studio
    password: studio  # pragma: allowlist secret
    source: masterdb_test
