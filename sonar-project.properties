sonar.projectKey=controlroom
sonar.projectName=STUD.io ControlRoom
sonar.projectVersion=1.3

# Source paths
sonar.sources=app/controlroom_backend,app/controlroom_frontend

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  app/controlroom_backend/tests/**,\
  app/controlroom_frontend/.next/**,\
  app/controlroom_frontend/.next-e2e*/**,\
  app/controlroom_frontend/.next-perf/**,\
  app/controlroom_frontend/__tests__/**,\
  app/controlroom_frontend/e2e/**,\
  app/controlroom_frontend/jest.config.ts,\
  app/controlroom_frontend/playwright*.config.ts,\
  app/controlroom_frontend/app/globals.css,\
  app/controlroom_backend/schemas/common.py

# Test paths
sonar.tests=app/controlroom_backend/tests

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/controlroom_backend/coverage.xml

# TypeScript
sonar.javascript.lcov.reportPaths=app/controlroom_frontend/coverage/lcov.info

# Coverage exclusions — boilerplate and thin wrappers with no testable logic
sonar.coverage.exclusions=\
  app/controlroom_frontend/app/layout.tsx,\
  app/controlroom_frontend/app/providers.tsx,\
  app/controlroom_frontend/app/page.tsx,\
  app/controlroom_frontend/app/catalog/**,\
  app/controlroom_frontend/app/session/**,\
  app/controlroom_frontend/app/tools/**,\
  app/controlroom_frontend/app/config/**,\
  app/controlroom_frontend/app/admin/**,\
  app/controlroom_frontend/app/login/**,\
  app/controlroom_frontend/components/ui/**,\
  app/controlroom_frontend/components/layout/LayoutShell.tsx,\
  app/controlroom_frontend/components/tables/**/columns.tsx


# Give the Node.js JS/TS analysis bridge enough heap to avoid WebSocket crashes
sonar.javascript.node.maxspace=12288

# Use a simplified tsconfig (no Next.js plugin, no generated .next* paths)
# to avoid TypeScript type resolution crashes in the SonarJS bridge.
# skipTypeChecking disables full cross-file type resolution (analyzeProject mode)
# which OOMs the Node.js bridge on this project's 85-file type graph.
sonar.javascript.tsconfigPaths=app/controlroom_frontend/tsconfig.sonar.json
sonar.javascript.skipTypeChecking=true

# Encoding
sonar.sourceEncoding=UTF-8
