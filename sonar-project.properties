sonar.projectKey=controlroom
sonar.projectName=STUD.io
sonar.projectVersion=1.3

# Source paths
sonar.sources=app/controlroom_backend,app/studio_frontend,app/gearlist_backend

# Exclusions
sonar.exclusions=\
  **/coverage/**,\
  **/perf-reports/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  app/controlroom_backend/tests/**,\
  app/gearlist_backend/**/*_test.go,\
  app/studio_frontend/.next/**,\
  app/studio_frontend/.next-e2e*/**,\
  app/studio_frontend/.next-perf/**,\
  app/studio_frontend/__tests__/**,\
  app/studio_frontend/e2e/**,\
  app/studio_frontend/jest.config.ts,\
  app/studio_frontend/playwright*.config.ts,\
  app/studio_frontend/app/globals.css

# Test paths
sonar.tests=app/controlroom_backend/tests

# Go
sonar.go.coverage.reportPaths=app/gearlist_backend/coverage.out

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/controlroom_backend/coverage.xml

# TypeScript
sonar.javascript.lcov.reportPaths=app/studio_frontend/coverage/lcov.info

# Coverage exclusions — boilerplate and thin wrappers with no testable logic
sonar.coverage.exclusions=\
  app/studio_frontend/app/layout.tsx,\
  app/studio_frontend/app/providers.tsx,\
  app/studio_frontend/app/page.tsx,\
  app/studio_frontend/app/catalog/**,\
  app/studio_frontend/app/session/**,\
  app/studio_frontend/app/tools/**,\
  app/studio_frontend/app/config/**,\
  app/studio_frontend/app/admin/**,\
  app/studio_frontend/app/login/**,\
  app/studio_frontend/components/ui/**,\
  app/studio_frontend/components/layout/LayoutShell.tsx,\
  app/studio_frontend/components/tables/**/columns.tsx


# Give the Node.js JS/TS analysis bridge enough heap
sonar.javascript.node.maxspace=4096

# Full cross-file type resolution OOMs the Node.js bridge on this project's
# type graph. skipTypeChecking disables analyzeProject mode.
sonar.javascript.skipTypeChecking=true

# Encoding
sonar.sourceEncoding=UTF-8
